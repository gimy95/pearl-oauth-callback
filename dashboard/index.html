<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Pearl Al-Izdihar · Ads Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>
:root{
  --brand:#8B1538; --brand-2:#B0244F; --ink:#1A1A1A; --muted:#6B7280; --line:#E7E2E4;
  --bg:#F7F5F4; --card:#FFFFFF; --soft:#FBF7F8; --good:#0F8A5F; --bad:#C0392B;
  --snap:#E5B800; --tiktok:#25262B; --meta:#1877F2; --unknown:#9CA3AF;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 -apple-system,"Segoe UI",Roboto,Tahoma,Arial,sans-serif}
html[dir=rtl] body{font-family:Tahoma,"Segoe UI",Arial,sans-serif}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{background:var(--card);border-radius:16px;padding:32px;max-width:420px;width:100%;
  box-shadow:0 6px 30px rgba(0,0,0,.08);text-align:center}
.logo{width:56px;height:56px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;
  display:grid;place-items:center;margin:0 auto 14px;font-size:18px}
.login-card h1{font-size:20px;margin:0 0 6px}
.login-card p{color:var(--muted);margin:6px 0 18px}
.login-card input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;margin-bottom:10px}
.btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:600}
.btn:hover{background:var(--brand-2)}
.btn.wide{width:100%}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px}
#login-msg{min-height:1.5em;margin-top:12px;color:var(--muted)}
#login-msg.err{color:var(--bad)}
/* app */
header{background:var(--brand);color:#fff;padding:12px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header .logo{width:36px;height:36px;margin:0;background:#fff;color:var(--brand);font-size:13px}
header h1{font-size:16px;margin:0;flex:1;min-width:200px}
header .ghost{color:#fff;border-color:rgba(255,255,255,.4)}
.who{font-size:12px;opacity:.85}
.fresh{background:var(--soft);border-bottom:1px solid var(--line);padding:6px 20px;font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.fresh b{color:var(--ink);font-weight:600}
.fresh .warn{color:var(--bad)}
nav{background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 16px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;color:var(--muted);white-space:nowrap;font-weight:500}
nav button.on{color:var(--ink);border-bottom-color:var(--brand)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.filters label{font-size:12px;color:var(--muted)}
.filters select,.filters input{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;background:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:#fff;border:0;padding:6px 12px;color:var(--muted)}
.seg button.on{background:var(--brand);color:#fff}
.range-note{font-size:12px;color:var(--muted);margin-inline-start:auto}
main{padding:20px;max-width:1400px;margin:0 auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card .k{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.card .v{font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.card .s{font-size:12px;color:var(--muted);margin-top:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:18px}
.panel h2{font-size:14px;margin:0 0 12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:18px}
.grid2 > *{min-width:0}
.chart{position:relative;height:280px}
.chart.tall{height:340px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;text-align:start;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.wrap{white-space:normal;min-width:220px}
td.n,th.n{text-align:end}
tr.total td{font-weight:700;background:var(--soft)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px;vertical-align:middle}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:#FDECEC;color:var(--bad);margin-inline-start:6px}
.tag.info{background:#EEF2FF;color:#3730A3}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--muted)}
.funnel{display:grid;gap:10px}
.fstep{display:grid;grid-template-columns:150px 1fr 160px;gap:12px;align-items:center}
.fbar{height:30px;border-radius:6px;background:var(--brand);min-width:2px}
.fstep .lab{font-weight:600}
.fstep .val{font-variant-numeric:tabular-nums;color:var(--muted);text-align:end}
.notes{font-size:12px;color:var(--muted);padding:0 20px 24px;max-width:1400px;margin:0 auto}
.notes li{margin:3px 0}
.state{padding:60px 20px;text-align:center;color:var(--muted)}
.state.err{color:var(--bad)}
@media (max-width:640px){
  main{padding:12px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .card{padding:10px 12px} .card .v{font-size:19px}
  .fstep{grid-template-columns:80px 1fr 120px;gap:8px}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .range-note{margin-inline-start:0;width:100%}
  header h1{font-size:14px;min-width:0}
}
</style>
</head>

  </div>

  <main id="view"></main>

// ───────── state ─────────
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const S = { lang: store.get('pearl_lang') || 'en', tab: store.get('pearl_tab') || 'overview',
            preset: 'mtd', start: null, end: null, platform: 'all',
            info: [], daily: [], firstDay: '2026-01-01', stages: [], ads: [], rangeKey: null, user: null, test: false };
const TABS = ['overview', 'platforms', 'campaigns', 'funnel', 'monthly', 'weekly'];
const PRESETS = ['mtd', 'last_month', 'l7', 'l30', 'l90', 'ytd', 'all', 'custom'];

let sb = null;
try { sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, detectSessionInUrl: true } }); }
catch (e) { console.error('Supabase client failed to load', e); }

// ───────── helpers ─────────
const $ = (id) => document.getElementById(id);
function t(k) { const d = I18N[S.lang] || I18N.en; return d[k] !== undefined ? d[k] : (I18N.en[k] !== undefined ? I18N.en[k] : k); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function pname(p) { return (PLAT[p] || PLAT.unknown)[S.lang] || p; }
function pcolor(p) { return (PLAT[p] || PLAT.unknown).color; }
const nf0 = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 });
const nf2 = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function money(v, dec) { if (v == null || !isFinite(v)) return '—'; return (dec ? nf2 : nf0).format(v) + ' ' + t('sar'); }
function num(v) { return v == null || !isFinite(v) ? '—' : nf0.format(v); }
function pct(v, d = 1) { return v == null || !isFinite(v) ? '—' : (v * 100).toFixed(d) + '%'; }
function riyadhToday() {
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Riyadh', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
}
function s2d(s) { return new Date(s + 'T00:00:00Z'); }
function d2s(d) { return d.toISOString().slice(0, 10); }
function addDays(s, n) { const d = s2d(s); d.setUTCDate(d.getUTCDate() + n); return d2s(d); }
function daysBetween(a, b) { return Math.round((s2d(b) - s2d(a)) / 864e5) + 1; }
const LOCALE = () => S.lang === 'ar' ? 'ar-u-ca-gregory-nu-latn' : 'en-GB';
function dateLabel(s) { return s2d(s).toLocaleDateString(LOCALE(), { day: 'numeric', month: 'short', timeZone: 'UTC' }); }
function monthLabel(s) { return s2d(s).toLocaleDateString(LOCALE(), { month: 'short', year: 'numeric', timeZone: 'UTC' }); }
function fullDate(s) { return s2d(s).toLocaleDateString(LOCALE(), { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }); }

function presetRange(p) {
  const today = riyadhToday(); const d = s2d(today);
  switch (p) {
    case 'mtd': return [today.slice(0, 8) + '01', today];
    case 'last_month': return [d2s(new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() - 1, 1))),
                               d2s(new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 0)))];
    case 'l7': return [addDays(today, -6), today];
    case 'l30': return [addDays(today, -29), today];
    case 'l90': return [addDays(today, -89), today];
    case 'ytd': return [today.slice(0, 4) + '-01-01', today];
    case 'all': return [S.firstDay, today];
    default: return [S.start || today.slice(0, 8) + '01', S.end || today];
  }
}

// ───────── data ─────────
async function rpcAll(fn, args) {
  if (S.test) return (window.__TESTDATA__ || {})[fn] || [];
  const page = 1000; let from = 0, out = [];
  for (;;) {
    const { data, error } = await sb.rpc(fn, args).range(from, from + page - 1);
    if (error) throw error;
    out = out.concat(data || []);
    if (!data || data.length < page) break;
    from += page;
  }
  return out;
}
async function loadBase() {
  S.info = await rpcAll('dash_info', {});
  const firsts = S.info.map(r => r.first_data_day).filter(Boolean).sort();
  S.firstDay = firsts[0] || '2026-01-01';
  S.daily = (await rpcAll('dash_daily', { p_start: S.firstDay, p_end: riyadhToday() }))
    .map(r => ({ ...r, day: String(r.day).slice(0, 10) }));
}
async function loadRange() {
  const key = S.start + '|' + S.end;
  if (S.rangeKey === key) return;
  const [st, ad] = await Promise.all([
    rpcAll('dash_stages', { p_start: S.start, p_end: S.end }),
    rpcAll('dash_ads', { p_start: S.start, p_end: S.end }),
  ]);
  S.stages = st; S.ads = ad; S.rangeKey = key;
}

// ───────── aggregation ─────────
function inPlat(p) { return S.platform === 'all' || p === S.platform; }
function sumRows(rows) {
  const z = { spend: 0, vv: 0, imp: 0, clk: 0, leads: 0, book: 0, att: 0, paid: 0, ns: 0 };
  for (const r of rows) {
    z.spend += +r.spend_sar || 0; z.vv += +r.video_views_spend_sar || 0; z.imp += +r.impressions || 0;
    z.clk += +r.clicks || 0; z.leads += +r.leads || 0; z.book += +r.bookings || 0;
    z.att += +r.attended || 0; z.paid += +r.paid || 0; z.ns += +r.no_shows || 0;
  }
  return ratios(z);
}
function ratios(z) {
  return Object.assign(z, {
    cpl: z.leads ? z.spend / z.leads : null, cpb: z.book ? z.spend / z.book : null,
    br: z.leads ? z.book / z.leads : null, ar: z.book ? z.att / z.book : null, nsr: z.book ? z.ns / z.book : null,
    ctr: z.imp ? z.clk / z.imp : null, cpc: z.clk ? z.spend / z.clk : null, cpm: z.imp ? z.spend / z.imp * 1000 : null,
  });
}
function rowsIn(start, end, plat = true) { return S.daily.filter(r => r.day >= start && r.day <= end && (!plat || inPlat(r.platform))); }
function granularity(start, end) { const n = daysBetween(start, end); return n <= 62 ? 'day' : n <= 370 ? 'week' : 'month'; }
function bucketKey(s, g) {
  if (g === 'day') return s;
  if (g === 'month') return s.slice(0, 7) + '-01';
  const d = s2d(s); d.setUTCDate(d.getUTCDate() - d.getUTCDay()); return d2s(d);   // week starts Sunday
}
function buckets(rows, g, start, end) {
  const keys = [], seen = new Set();
  for (let cur = start; cur <= end; cur = addDays(cur, 1)) { const k = bucketKey(cur, g); if (!seen.has(k)) { seen.add(k); keys.push(k); } }
  const m = {}; keys.forEach(k => m[k] = []);
  rows.forEach(r => { const k = bucketKey(r.day, g); if (m[k]) m[k].push(r); });
  return { keys, m };
}
function bucketLabel(k, g) { return g === 'month' ? monthLabel(k) : dateLabel(k); }
function activePlatforms(rows) {
  return PLAT_ORDER.filter(p => rows.some(r => r.platform === p && ((+r.spend_sar || 0) > 0 || (+r.leads || 0) > 0)));
}

const charts = {};
function chart(id, cfg) {
  if (charts[id]) charts[id].destroy();
  const el = $(id); if (!el || !window.Chart) return;
  charts[id] = new Chart(el, cfg);
}
function destroyCharts() { for (const k in charts) { charts[k].destroy(); delete charts[k]; } }
function baseOpts({ stacked = false, y2 = false, yMoney = false } = {}) {
  const rtl = S.lang === 'ar';
  const o = {
    responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
    plugins: { legend: { position: 'bottom', rtl, labels: { boxWidth: 12 } }, tooltip: { rtl,
      callbacks: { label: (c) => `${c.dataset.label}: ${c.dataset._money ? money(c.parsed.y, true) : num(c.parsed.y)}` } } },
    scales: {
      x: { stacked, reverse: rtl, grid: { display: false } },
      y: { stacked, beginAtZero: true, position: rtl ? 'right' : 'left',
           ticks: { callback: (v) => yMoney ? nf0.format(v) : nf0.format(v) } },
    },
  };
  if (y2) o.scales.y2 = { beginAtZero: true, position: rtl ? 'left' : 'right', grid: { drawOnChartArea: false } };
  return o;
}

function card(k, v, s) { return `<div class="card"><div class="k">${esc(k)}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`; }
function delta(cur, prev, lowerIsBetter) {
  if (cur == null || prev == null || !isFinite(cur) || !isFinite(prev) || prev === 0) return '<span class="flat">—</span>';
  const d = (cur - prev) / Math.abs(prev); const good = lowerIsBetter ? d < 0 : d > 0;
  const cls = Math.abs(d) < 0.005 ? 'flat' : good ? 'up' : 'down';
  return `<span class="${cls}">${d > 0 ? '▲' : d < 0 ? '▼' : '•'} ${Math.abs(d * 100).toFixed(1)}%</span>`;
}

function periodTable(keys, m, g, labelFn, title, chartTitle, chartId) {
  const today = riyadhToday();
  const rows = keys.map(k => ({ k, z: sumRows(m[k]) }));
  const partial = (k) => g === 'month' ? today.slice(0, 7) === k.slice(0, 7) : (k <= today && addDays(k, 6) >= today);
  const body = rows.map((r, i) => { const p = i > 0 ? rows[i - 1].z : null; const z = r.z; return `<tr>
      <td>${esc(labelFn(r.k))}${partial(r.k) ? ` <span class="tag info">${t('in_progress')}</span>` : ''}</td>
      <td class="n">${money(z.spend)}</td><td class="n">${p ? delta(z.spend, p.spend, false) : ''}</td>
      <td class="n">${num(z.leads)}</td><td class="n">${p ? delta(z.leads, p.leads, false) : ''}</td>
      <td class="n">${money(z.cpl, true)}</td><td class="n">${p ? delta(z.cpl, p.cpl, true) : ''}</td>
      <td class="n">${num(z.book)}</td><td class="n">${money(z.cpb, true)}</td><td class="n">${p ? delta(z.cpb, p.cpb, true) : ''}</td>
      <td class="n">${pct(z.br)}</td><td class="n">${num(z.att)}</td></tr>`; }).reverse().join('');
  $('view').innerHTML = `
    <div class="panel"><h2>${chartTitle}</h2><div class="chart tall"><canvas id="${chartId}"></canvas></div></div>
    <div class="panel"><h2>${title}</h2><div class="tbl"><table><thead><tr>
      <th>${g === 'month' ? t('month') : t('week')}</th><th class="n">${t('spend')}</th><th class="n">${t('change')}</th>
      <th class="n">${t('leads')}</th><th class="n">${t('change')}</th><th class="n">${t('cpl')}</th><th class="n">${t('change')}</th>
      <th class="n">${t('bookings')}</th><th class="n">${t('cpb')}</th><th class="n">${t('change')}</th>
      <th class="n">${t('booking_rate')}</th><th class="n">${t('attended')}</th></tr></thead><tbody>${body}</tbody></table></div></div>`;
  const labels = rows.map(r => labelFn(r.k));
  chart(chartId, { data: { labels, datasets: [
      { type: 'bar', label: t('spend'), _money: true, data: rows.map(r => r.z.spend), backgroundColor: 'rgba(139,21,56,.75)', yAxisID: 'y' },
      { type: 'line', label: t('leads'), data: rows.map(r => r.z.leads), borderColor: '#2563EB', backgroundColor: '#2563EB', yAxisID: 'y2', tension: .25 },
      { type: 'line', label: t('bookings'), data: rows.map(r => r.z.book), borderColor: '#0F8A5F', backgroundColor: '#0F8A5F', yAxisID: 'y2', tension: .25 },
    ] }, options: baseOpts({ y2: true, yMoney: true }) });
}
function viewMonthly() {

  periodTable(keys, m, 'week', dateLabel, t('t_week'), t('ch_week'), 'c_week');
}

      parts.push(`${t('crm_import')}: <b>${esc(ts)}</b>`);
    } else if (r.last_data_day) {
      const p = r.source.replace('spend:', ''); const d = String(r.last_data_day).slice(0, 10);
      parts.push(d >= recent ? `${esc(pname(p))}: <b>${esc(fullDate(d))}</b>`

  $('fresh').innerHTML = `<span>${t('fresh_through')} →</span>` + parts.map(p => `<span>${p}</span>`).join('');
}

    `<button data-plat="${p}" class="${S.platform === p ? 'on' : ''}">${p === 'all' ? t('all_platforms') : esc(pname(p))}</button>`).join('');
  const g = granularity(S.start, S.end);
  $('range-note').textContent = S.start ? `${fullDate(S.start)} – ${fullDate(S.end)} · ${t('rng_days').replace('{n}', daysBetween(S.start, S.end))} · ${t('gran_' + g)}` : '';
  $('notes').innerHTML = t('n_rules').map(n => `<li>${esc(n)}</li>`).join('');
  renderFresh();
}
async function refresh() {
  renderChrome(); destroyCharts();
  const needsRange = S.tab === 'campaigns' || S.tab === 'funnel';
  if (needsRange && S.rangeKey !== S.start + '|' + S.end) {
    $('view').innerHTML = `<div class="state">${t('loading')}</div>`;
    try { await loadRange(); } catch (e) { return showErr(e); }
  }
  const z = { overview: viewOverview, platforms: viewPlatforms, campaigns: viewCampaigns, funnel: viewFunnel,
              monthly: viewMonthly, weekly: viewWeekly }[S.tab]();
  const vv = sumRows(rowsIn(S.start, S.end)).vv;
  if (vv > 0 && (S.tab === 'overview' || S.tab === 'platforms' || S.tab === 'campaigns')) {
    $('notes').insertAdjacentHTML('afterbegin', `<li>${esc(t('n_vv').replace('{x}', money(vv)))}</li>`);
  }
}
function setPreset(p) { S.preset = p; if (p !== 'custom') { [S.start, S.end] = presetRange(p); } }
function showErr(e) {
  const msg = (e && (e.message || e.error_description)) || String(e);
  const denied = /not authorized|permission denied|42501/i.test(msg + ' ' + (e && e.code));
  $('view').innerHTML = `<div class="state err">${esc(denied ? t('no_access') : t('load_err') + msg)}</div>`;
}

// ───────── auth + startup ─────────
function showLogin() { $('app').hidden = true; $('login').hidden = false; renderChrome(); }
async function startApp(user) {
  S.user = user; $('login').hidden = true; $('app').hidden = false;
  $('who').textContent = user && user.email ? user.email : '';
  setPreset(S.preset); renderChrome();
  $('view').innerHTML = `<div class="state">${t('loading')}</div>`;
  try { await loadBase(); setPreset(S.preset); await refresh(); } catch (e) { renderChrome(); showErr(e); }
}

document.addEventListener('click', async (ev) => {
  const el = ev.target.closest('button'); if (!el) return;
  if (el.classList.contains('lang-toggle')) { S.lang = S.lang === 'ar' ? 'en' : 'ar'; store.set('pearl_lang', S.lang);
    if (!$('app').hidden) await refresh(); else renderChrome(); return; }
  if (el.dataset.tab) { S.tab = el.dataset.tab; store.set('pearl_tab', S.tab); await refresh(); return; }
  if (el.dataset.plat) { S.platform = el.dataset.plat; await refresh(); return; }
  if (el.id === 'signout') { if (sb && !S.test) await sb.auth.signOut(); S.user = null; showLogin(); }
});
$('preset').addEventListener('change', async (e) => { setPreset(e.target.value); await refresh(); });
['d-start', 'd-end'].forEach(id => $(id).addEventListener('change', async () => {
  const a = $('d-start').value, b = $('d-end').value;
  if (a && b && a <= b) { S.start = a; S.end = b; await refresh(); }
}));
$('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = $('login-msg'); msg.className = ''; msg.textContent = t('sending');
  const email = $('email').value.trim();
  const redirect = location.origin + location.pathname;
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: redirect } });
  if (error) { msg.className = 'err'; msg.textContent = error.message; } else { msg.textContent = t('link_sent'); }
});

// Local preview only: lets a developer render the page with saved sample data.
// Never active on the live site (github.io), and test_data.js is not published.
const LOCAL_PREVIEW = location.protocol === 'file:' || ['localhost', '127.0.0.1'].includes(location.hostname);
if (LOCAL_PREVIEW) {
  window.__pearlTest = async () => {
    await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'test_data.js';
      s.onload = ok; s.onerror = no; document.head.appendChild(s); });
    S.test = true; await startApp({ email: 'preview (sample data)' });
  };
}

(async function init() {
  renderChrome();
  if (location.protocol === 'file:' && !sb) { showLogin(); return; }
  if (!sb) { $('login').hidden = false; $('login-msg').className = 'err'; $('login-msg').textContent = 'Could not load the sign-in library.'; return; }
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' && session && !S.user) startApp(session.user);
    if (event === 'SIGNED_OUT') { S.user = null; showLogin(); }
  });
  const { data } = await sb.auth.getSession();
  if (data && data.session) { if (!S.user) startApp(data.session.user); } else if (!S.user) showLogin();
})();
</script>
</body>
</html>
