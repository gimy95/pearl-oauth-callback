<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Pearl Al-Izdihar — Digital Performance Dashboard</title>

<style>
:root{
  --plum:#4A0E2B; --brand:#8B1538; --brand-2:#B0244F; --rose:#E8457A; --blush:#FCEFF3; --blush-2:#F8E1E8;
  --ink:#1F1A1C; --muted:#6B6266; --line:#EBDDE2; --bg:#FBF7F8; --card:#FFFFFF;
  --good:#0F8A5F; --bad:#C0392B; --warn:#B45309;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"Segoe UI",Roboto,Tahoma,Arial,sans-serif}
html[dir=rtl] body{font-family:Tahoma,"Segoe UI",Arial,sans-serif}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
.ar{display:block;font-size:.78em;color:var(--muted);font-weight:400;letter-spacing:0;text-transform:none;direction:rtl;font-family:Tahoma,Arial,sans-serif}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--plum),var(--brand))}
.login-card{background:var(--card);border-radius:18px;padding:34px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25);text-align:center}
.logo{width:58px;height:58px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;display:grid;place-items:center;margin:0 auto 14px;font-size:18px;border:3px solid #fff;box-shadow:0 0 0 2px var(--rose)}
.login-card h1{font-size:20px;margin:0 0 6px}
.login-card p{color:var(--muted);margin:6px 0 18px}
.login-card input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;margin-bottom:10px}
.btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:600}
.btn:hover{background:var(--brand-2)} .btn.wide{width:100%}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px}
#login-msg{min-height:1.5em;margin-top:12px;color:var(--muted)} #login-msg.err{color:var(--bad)}
/* header */
header{background:linear-gradient(120deg,var(--plum),#6A1438);color:#fff;padding:20px 28px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
header .logo{width:64px;height:64px;margin:0;background:#fff;color:var(--brand);font-size:18px;flex-shrink:0}
.htitle{flex:1;min-width:240px}
.htitle h1{margin:0;font-size:24px;line-height:1.25}
.htitle h1 em{font-style:normal;color:#FF8DB0}
.htitle .sub{opacity:.85;font-size:13px;margin-top:4px}
.hmeta{text-align:end;font-size:12px;opacity:.9;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
html[dir=rtl] .hmeta{align-items:flex-start}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.hbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:6px 12px}
.hbtn:hover{background:rgba(255,255,255,.22)}
.fresh{background:var(--blush);border-bottom:1px solid var(--line);padding:6px 28px;font-size:12px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
.fresh b{color:var(--ink);font-weight:600} .fresh .warn{color:var(--bad)}
nav{background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 20px;overflow-x:auto;position:sticky;top:0;z-index:10}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:14px 16px;color:var(--muted);white-space:nowrap;font-weight:600}
nav button.on{color:var(--plum);border-bottom-color:var(--brand)}
.filters{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center;padding:14px 28px;background:var(--blush);border-bottom:1px solid var(--line)}
.flabel{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.pill{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:600}
.pill.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.filters input,.filters select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;background:#fff}
.linkbtn{background:none;border:0;color:var(--brand);text-decoration:underline;padding:0}
.showing{margin-inline-start:auto;font-size:12px;color:var(--muted)}
main{padding:22px 28px;max-width:1440px;margin:0 auto}
/* blocks */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:20px}
.panel h2{font-size:16px;margin:0 0 14px;color:var(--plum)}
.panel h2 .ar{font-size:12px}
.takeaways{border-inline-start:5px solid var(--brand);background:linear-gradient(90deg,var(--blush),#fff)}
.takeaways ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.takeaways li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.takeaways .ico{font-size:16px;line-height:1.4}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.kpi{background:var(--blush);border-radius:12px;padding:14px;text-align:center}
.kpi .v{font-size:22px;font-weight:800;color:var(--plum);font-variant-numeric:tabular-nums}
.kpi .k{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-top:4px}
.kpi .t{font-size:11px;margin-top:4px}
.kpi.good .v{color:var(--good)} .kpi.bad .v{color:var(--bad)}
.note{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.55}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:20px}
.grid2 > *{min-width:0}
.chart{position:relative;height:300px} .chart.tall{height:360px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;text-align:start;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap;background:#fff}
td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.wrap{white-space:normal;min-width:220px;max-width:420px;word-break:break-word}
td.n,th.n{text-align:end}
tr.total td{font-weight:700;background:var(--blush)}
tr.sub td{color:var(--muted);font-size:12px}
tr.sub td:first-child{padding-inline-start:26px}
tbody tr:hover td{background:#FDF6F8}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px;vertical-align:middle}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:#FDECEC;color:var(--bad);margin-inline-start:6px}
.tag.info{background:#EEF2FF;color:#3730A3} .tag.ok{background:#E8F6EF;color:var(--good)}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--muted)}
.best{background:#E8F6EF!important;font-weight:700}
.creatives{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.creative{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.creative .rank{background:var(--brand);color:#fff;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-weight:700;flex-shrink:0}
.creative .nm{font-weight:600;word-break:break-word;font-size:13px}
.creative .mt{font-size:12px;color:var(--muted);margin-top:4px}
.pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.pcard{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pcard .ph{padding:10px 14px;color:#fff;font-weight:700}
.pcard dl{margin:0;padding:10px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:13px}
.pcard dt{color:var(--muted)} .pcard dd{margin:0;font-weight:600;text-align:end;font-variant-numeric:tabular-nums}
.statusgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.funnel{display:grid;gap:10px}
.fstep{display:grid;grid-template-columns:160px 1fr 190px;gap:12px;align-items:center}
.fbar{height:30px;border-radius:6px;background:var(--brand);min-width:2px}
.fstep .lab{font-weight:600} .fstep .val{color:var(--muted);text-align:end;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-inline-end:10px}
.seg button{background:#fff;border:0;padding:5px 12px;color:var(--muted)}
.seg button.on{background:var(--brand);color:#fff}
.notes{font-size:12px;color:var(--muted);padding:0 28px 30px;max-width:1440px;margin:0 auto}
.notes li{margin:3px 0}
.state{padding:60px 20px;text-align:center;color:var(--muted)} .state.err{color:var(--bad)}
footer.pf{text-align:center;color:var(--muted);font-size:12px;padding:10px 0 30px}
@media (max-width:700px){
  header{padding:16px} .htitle h1{font-size:18px} main{padding:14px} .filters{padding:12px 14px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .kpi .v{font-size:18px}
  .fstep{grid-template-columns:90px 1fr 120px;gap:8px} .showing{margin-inline-start:0;width:100%}
  .hmeta{align-items:flex-start;text-align:start}
}
@media print{
  nav,.filters,.hbtns,#signout{display:none!important}
  body{background:#fff} .panel{break-inside:avoid;box-shadow:none}
  header{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

async function rpcAll(fn, args) {

    return t; }
  const page = 1000; let from = 0, out = [];
  for (;;) {
    const { data, error } = await sb.rpc(fn, args).range(from, from + page - 1);
    if (error) throw error;

    from += page;
  }
  return out;
}

  S.info = info; S.settings = Object.fromEntries((settings || []).map(r => [r.key, r.value]));

}

const inPlat = (p) => S.platform === 'all' || p === S.platform;
function Z() { return { spend: 0, vv: 0, imp: 0, clk: 0, pl: 0, leads: 0, book: 0, att: 0, paid: 0, ns: 0 }; }
function addRow(z, r) {
  z.spend += +r.spend_sar || 0; z.vv += +r.video_views_spend_sar || 0; z.imp += +r.impressions || 0; z.clk += +r.clicks || 0;
  z.pl += +r.platform_leads || 0; z.leads += +r.leads || 0; z.book += +r.bookings || 0; z.att += +r.attended || 0;
  z.paid += +r.paid || 0; z.ns += +r.no_shows || 0; return z;
}
function ratios(z) {
  return Object.assign(z, { cpl: z.leads ? z.spend / z.leads : null, pcpl: z.pl ? z.spend / z.pl : null,
    cpb: z.book ? z.spend / z.book : null, br: z.leads ? z.book / z.leads : null, ctr: z.imp ? z.clk / z.imp : null,
    cpc: z.clk ? z.spend / z.clk : null, nsr: z.book ? z.ns / z.book : null, ar: z.book ? z.att / z.book : null });
}
function sumRows(rows) { const z = Z(); rows.forEach(r => addRow(z, r)); return ratios(z); }
function rowsIn(start, end, plat = true) { return S.daily.filter(r => r.day >= start && r.day <= end && (!plat || inPlat(r.platform))); }
function platRates() {   // CRM bookings per platform lead, by platform, for the current range (used for estimates)
  const out = {}; for (const p of PLAT_ORDER) { const z = sumRows(rowsIn(S.start, S.end, false).filter(r => r.platform === p)); out[p] = z.pl ? z.book / z.pl : null; }
  return out;
}
function adsAgg(rows, keyFn, metaFn) {   // group ad rows; estimates use platform booking rate
  const rate = platRates(); const m = new Map();

    if (!g) { g = { key: k, spend: 0, imp: 0, clk: 0, pl: 0, crmL: 0, crmB: 0, hasAct: false, est: 0, plats: new Set(), vv: false, n: 0 }; if (metaFn) Object.assign(g, metaFn(r)); m.set(k, g); }
    if (!r.is_video_views) { g.spend += +r.spend_sar || 0; g.imp += +r.impressions || 0; g.clk += +r.clicks || 0; }
    else g.vv = true;

    if (r.crm_leads != null) { g.hasAct = true; g.crmL += +r.crm_leads || 0; g.crmB += +r.crm_bookings || 0; }
    if (r.platform === 'snapchat' && r.crm_bookings != null) g.est += +r.crm_bookings || 0;   // snapchat: actual
    else if (rate[r.platform] != null) g.est += pl * rate[r.platform];

// ───────── views ─────────
function takeaways(z) {
  const rows = rowsIn(S.start, S.end, false); const items = [];
  const pz = PLAT_ORDER.filter(p => p !== 'unknown').map(p => ({ p, z: sumRows(rows.filter(r => r.platform === p)) })).filter(x => x.z.leads >= 15);
  if (pz.length >= 2 && S.platform === 'all') {
    const sorted = pz.slice().sort((a, b) => b.z.br - a.z.br);
    const b = sorted[0], w = sorted[sorted.length - 1];
    items.push(['🏆', fill(T('tk_best'), { p: pname(b.p), r: pct(b.z.br), c: money(b.z.cpb) })]);
    if (w.z.br < b.z.br * 0.85) items.push(['⚠️', fill(T('tk_worst'), { p: pname(w.p), r: pct(w.z.br) })]);
  }
  const n = daysBetween(S.start, S.end); const pe = addDays(S.start, -1), ps = addDays(S.start, -n);
  const prev = sumRows(rowsIn(ps, pe));
  if (z.cpl != null && prev.cpl != null && ps >= S.firstDay) {
    const d = (z.cpl - prev.cpl) / prev.cpl;
    items.push([d <= 0 ? '📉' : '📈', fill(T(d <= 0 ? 'tk_cpl_down' : 'tk_cpl_up'), { x: pct(Math.abs(d)), a: money(prev.cpl), b: money(z.cpl) })]);
  }
  const cats = adsAgg(adsInPlat(S.ads).filter(r => !r.is_video_views), r => r.category, r => ({ cat: r.category })).sort((a, b) => b.pl - a.pl);
  const totPl = cats.reduce((a, c) => a + c.pl, 0);
  if (cats.length && totPl) items.push(['🎯', fill(T('tk_cat'), { c: catName(cats[0].cat), s: pct(cats[0].pl / totPl), l: money(cats[0].cpl) })]);
  const g = stageGroups(S.stages.filter(s => inPlat(s.platform)));
  if (g.total && (g.new + g.noanswer) / g.total > 0.35) items.push(['📞', fill(T('tk_followup'), { n: num(g.new + g.noanswer), s: pct((g.new + g.noanswer) / g.total) })]);

function renderMatrix() {
  const panel = $('mx-panel'); if (!panel) return;
  const today = riyadhToday();
  const allMonths = [...new Set(S.adsAll.map(r => r.month.slice(0, 7)))].sort();
  const months = S.mx.months === 0 ? allMonths : allMonths.slice(-S.mx.months);
  const rows = S.adsAll.filter(r => inPlat(r.platform) && months.includes(r.month.slice(0, 7)) && !r.is_video_views);
  const rateAll = {}; for (const p of PLAT_ORDER) { const z = sumRows(S.daily.filter(r => r.platform === p)); rateAll[p] = z.pl ? z.book / z.pl : null; }
  const cell = (rs) => { let sp = 0, pl = 0, b = 0; for (const r of rs) { sp += +r.spend_sar || 0; const l = +r.platform_leads || 0; pl += l;
      b += r.platform === 'snapchat' && r.crm_bookings != null ? (+r.crm_bookings || 0) : (rateAll[r.platform] != null ? l * rateAll[r.platform] : 0); }
    return { sp, pl, b, cpl: pl ? sp / pl : null, cpb: b ? sp / b : null }; };
  const metric = S.mx.metric; const lowerBetter = metric === 'cpl' || metric === 'cpb';
  const fmt = (c) => !c ? '—' : metric === 'sp' ? money(c.sp, 0) : metric === 'pl' ? (c.pl ? num(c.pl) : '—') : metric === 'b' ? (c.b ? num1(c.b) : '—') : metric === 'cpl' ? money(c.cpl, 0) : money(c.cpb, 0);
  const val = (c) => !c ? null : metric === 'sp' ? c.sp : metric === 'pl' ? c.pl : metric === 'b' ? c.b : metric === 'cpl' ? c.cpl : c.cpb;
  const cats = [...new Set(rows.map(r => r.category))].sort((a, b) => cell(rows.filter(r => r.category === b)).sp - cell(rows.filter(r => r.category === a)).sp);
  const plats = PLAT_ORDER.filter(p => rows.some(r => r.platform === p));
  let body = '';
  for (const c of cats) {
    const rc = rows.filter(r => r.category === c);
    const per = Object.fromEntries(plats.map(p => [p, months.map(m => { const rs = rc.filter(r => r.platform === p && r.month.slice(0, 7) === m); return rs.length ? cell(rs) : null; })]));
    const best = months.map((m, i) => { let bp = null, bv = null; for (const p of plats) { const v = val(per[p][i]); if (v == null || !isFinite(v) || v === 0) continue; if (bv == null || (lowerBetter ? v < bv : v > bv)) { bv = v; bp = p; } } return bp; });
    const allC = months.map(m => { const rs = rc.filter(r => r.month.slice(0, 7) === m); return rs.length ? cell(rs) : null; });
    const momOf = (arr) => { const full = months.filter(m => m !== today.slice(0, 7)); if (full.length < 2) return ''; const a = arr[months.indexOf(full[full.length - 1])], b = arr[months.indexOf(full[full.length - 2])]; return delta(val(a), val(b), lowerBetter); };
    body += `<tr class="total"><td>${esc(catName(c))}</td><td>${esc(T('all_channels'))}</td>${allC.map(x => `<td class="n">${fmt(x)}</td>`).join('')}<td class="n">${fmt(cell(rc))}</td><td class="n">${momOf(allC)}</td></tr>`;
    if (S.platform === 'all') for (const p of plats) { if (!per[p].some(Boolean)) continue;
      body += `<tr class="sub"><td></td><td><span class="dot" style="background:${pcolor(p)}"></span>${esc(pname(p))}</td>${per[p].map((x, i) => `<td class="n${best[i] === p && plats.length > 1 ? ' best' : ''}">${fmt(x)}</td>`).join('')}<td class="n">${fmt(cell(rc.filter(r => r.platform === p)))}</td><td class="n">${momOf(per[p])}</td></tr>`; }
  }
  const metricBtns = [['sp', 'spend'], ['pl', 'platform_leads'], ['cpl', 'platform_cpl'], ['b', 'est_bookings'], ['cpb', 'cpb']];
  panel.innerHTML = `${H2('matrix')}<div style="margin-bottom:12px"><span class="flabel">${esc(T('metric'))}</span>
    <span class="seg">${metricBtns.map(([k, l]) => `<button data-mx-metric="${k}" class="${metric === k ? 'on' : ''}">${esc(T(l))}</button>`).join('')}</span>
    <span class="flabel">${esc(T('months'))}</span><span class="seg">${[[3, 'last3'], [6, 'last6'], [0, 'all_m']].map(([k, l]) => `<button data-mx-months="${k}" class="${S.mx.months === k ? 'on' : ''}">${esc(T(l))}</button>`).join('')}</span></div>
    <div class="tbl"><table><thead><tr><th>${L('category')}</th><th>${L('platform')}</th>${months.map(m => `<th class="n">${esc(monthLabel(m))}${m === today.slice(0, 7) ? '*' : ''}</th>`).join('')}<th class="n">${L('total')}</th><th class="n">${L('mom_col')}</th></tr></thead>
    <tbody>${body || '<tr><td>—</td></tr>'}</tbody></table></div><div class="note">${esc(T('best_cell'))} ${esc(T('n_matrix'))} ${esc(T('n_cat'))}</div>`;
}

  const wz = weeks.map(w => sumRows(rowsIn(w, addDays(w, 6))));
  const body = wz.map((z, i) => { const p = i ? wz[i - 1] : null; const [lab] = isoWeek(weeks[i]); return `<tr><td>${esc(lab)}<span class="ar" style="direction:ltr;text-align:start">${esc(weeks[i])}</span></td>
    <td class="n">${money(z.spend)}${p ? delta(z.spend, p.spend) : ''}</td><td class="n">${num(z.pl)}${p ? delta(z.pl, p.pl) : ''}</td>
    <td class="n">${num(z.leads)}${p ? delta(z.leads, p.leads) : ''}</td><td class="n">${money(z.cpl)}${p ? delta(z.cpl, p.cpl, true) : ''}</td>
    <td class="n">${num(z.book)}${p ? delta(z.book, p.book) : ''}</td><td class="n">${money(z.cpb)}${p ? delta(z.cpb, p.cpb, true) : ''}</td><td class="n">${pct(z.br)}</td></tr>`; }).join('');
  $('view').innerHTML = `<div class="panel">${H2('wow')}<div class="tbl"><table><thead><tr><th>${L('iso_week')}</th><th class="n">${L('spend')}</th><th class="n">${L('platform_leads')}</th>
    <th class="n">${L('crm_leads')}</th><th class="n">${L('cpl')}</th><th class="n">${L('bookings')}</th><th class="n">${L('cpb')}</th><th class="n">${L('booking_rate')}</th></tr></thead><tbody>${body}</tbody></table></div></div>
    <div class="panel">${H2('wk_chart')}<div class="chart tall"><canvas id="c_w"></canvas></div></div>`;
  chart('c_w', { data: { labels: weeks.map(w => isoWeek(w)[0]), datasets: [
    { type: 'bar', label: T('spend'), _money: true, data: wz.map(z => z.spend), backgroundColor: 'rgba(139,21,56,.8)', yAxisID: 'y' },
    { type: 'line', label: T('crm_leads'), data: wz.map(z => z.leads), borderColor: '#4A0E2B', backgroundColor: '#4A0E2B', yAxisID: 'y2', tension: .25 },
    { type: 'line', label: T('platform_leads'), data: wz.map(z => z.pl), borderColor: '#E8457A', backgroundColor: '#E8457A', yAxisID: 'y2', tension: .25 },
  ] }, options: opts({ y2: true }) });
}

// ───────── chrome ─────────
function renderFresh() {
  const parts = []; const recent = addDays(riyadhToday(), -45);
  for (const r of S.info) {
    if (r.source === 'crm') { const ts = r.last_loaded_at ? new Date(r.last_loaded_at).toLocaleString(LOCALE(), { timeZone: 'Asia/Riyadh', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—';
      parts.push(`${esc(T('crm_import'))}: <b>${esc(ts)}</b>`); }
    else if (r.last_data_day) { const p = r.source.replace('spend:', ''); const d = String(r.last_data_day).slice(0, 10);
      parts.push(d >= recent ? `${esc(pname(p))}: <b>${esc(d)}</b>` : `<span class="warn">${esc(pname(p))}: ${esc(T('no_spend_since'))} ${esc(d)}</span>`); }
  }
  $('fresh').innerHTML = `<span>${esc(T('fresh_through'))} →</span>` + parts.map(p => `<span>${p}</span>`).join('');
}
function renderChrome() {
  document.documentElement.lang = S.lang; document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
  document.title = S.lang === 'ar' ? 'بيرل الازدهار — لوحة الأداء الرقمي' : 'Pearl Al-Izdihar — Digital Performance Dashboard';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T(el.dataset.i18n); });
  document.querySelectorAll('.lang-toggle').forEach(b => { b.textContent = S.lang === 'ar' ? 'English' : 'العربية'; });
  $('h-title').innerHTML = T('title_html');
  $('h-sub').innerHTML = esc(T('sub')) + (S.lang === 'en' ? `<span class="ar">${esc(I18N.ar.sub)}</span>` : '');
  const lastDays = S.info.filter(r => r.last_data_day).map(r => String(r.last_data_day).slice(0, 10)).sort();
  $('h-range').textContent = S.firstDay && lastDays.length ? `${T('data_range')}: ${S.firstDay} → ${lastDays[lastDays.length - 1]}` : '';
  $('h-gen').textContent = S.loadedAt ? `${T('generated')} ${S.loadedAt.toLocaleString(LOCALE(), { timeZone: 'Asia/Riyadh', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })}` : '';
  $('tabs').innerHTML = TABS.map(k => `<button data-tab="${k}" class="${S.tab === k ? 'on' : ''}">${esc(T(k))}</button>`).join('');
  $('presets').innerHTML = PRESETS.map(p => `<button class="pill ${S.preset === p ? 'on' : ''}" data-preset="${p}" type="button">${esc(T(p))}</button>`).join(' ');
  $('d-start').value = S.start || ''; $('d-end').value = S.end || '';
  $('platform').innerHTML = ['all', 'snapchat', 'tiktok', 'meta'].map(p => `<option value="${p}" ${S.platform === p ? 'selected' : ''}>${p === 'all' ? esc(T('all')) : esc(pname(p))}</option>`).join('');
  $('showing').textContent = S.start ? `${T('showing')} ${S.start} → ${S.end} · ${fill(T('rng_days'), { n: daysBetween(S.start, S.end) })}` : '';
  $('notes').innerHTML = T('n_rules').map(n => `<li>${esc(n)}</li>`).join('');
  $('foot').innerHTML = `<b>${S.lang === 'ar' ? 'بيرل الازدهار' : 'Pearl Al-Izdihar'}</b> — ${S.lang === 'ar' ? 'المصدر: Snapchat وTikTok وMeta APIs ونظام FantasyHub (Supabase)' : 'Data source: Snapchat, TikTok & Meta APIs + FantasyHub CRM (Supabase)'}`;
  renderFresh();
}
async function refresh() {
  renderChrome(); destroyCharts();
  if (S.rangeKey !== S.start + '|' + S.end) {
    $('view').innerHTML = `<div class="state">${esc(T('loading'))}</div>`;
    try { await loadRange(); } catch (e) { return showErr(e); }
  }
  const fn = { summary: viewSummary, platforms: viewPlatforms, campaigns: viewCampaigns, funnel: viewFunnel, monthly: viewMonthly, weekly: viewWeekly }[S.tab] || viewSummary;
  try { await fn(); } catch (e) { console.error(e); showErr(e); }
}
function setPreset(p) { S.preset = p; const r = presetRange(p); if (r[0]) { S.start = r[0]; S.end = r[1]; } }
function showErr(e) {
  const msg = (e && (e.message || e.error_description)) || String(e);
  const denied = /not authorized|permission denied|42501/i.test(msg + ' ' + (e && e.code));
  $('view').innerHTML = `<div class="state err">${esc(denied ? T('no_access') : T('load_err') + msg)}</div>`;
}

// ───────── auth + startup ─────────
function showLogin() { $('app').hidden = true; $('login').hidden = false; renderChrome(); }
async function startApp(user) {
  S.user = user; $('login').hidden = true; $('app').hidden = false;
  setPreset(S.preset); renderChrome();
  $('view').innerHTML = `<div class="state">${esc(T('loading'))}</div>`;
  try { await loadBase(); setPreset(S.preset); await refresh(); } catch (e) { renderChrome(); showErr(e); }
}
document.addEventListener('click', async (ev) => {
  const el = ev.target.closest('button'); if (!el) return;
  if (el.classList.contains('lang-toggle')) { S.lang = S.lang === 'ar' ? 'en' : 'ar'; store.set('pearl_lang', S.lang); if (!$('app').hidden) await refresh(); else renderChrome(); return; }
  if (el.dataset.tab) { S.tab = el.dataset.tab; store.set('pearl_tab2', S.tab); await refresh(); return; }
  if (el.dataset.preset) { setPreset(el.dataset.preset); await refresh(); return; }
  if (el.dataset.mxMetric) { S.mx.metric = el.dataset.mxMetric; renderMatrix(); return; }
  if (el.dataset.mxMonths !== undefined) { S.mx.months = +el.dataset.mxMonths; renderMatrix(); return; }
  if (el.id === 'reset') { S.platform = 'all'; setPreset('mtd'); await refresh(); return; }
  if (el.id === 'print') { window.print(); return; }
  if (el.id === 'signout') { if (sb && !S.test) await sb.auth.signOut(); S.user = null; showLogin(); }
});
$('platform').addEventListener('change', async (e) => { S.platform = e.target.value; await refresh(); });
['d-start', 'd-end'].forEach(id => $(id).addEventListener('change', async () => {
  const a = $('d-start').value, b = $('d-end').value;
  if (a && b && a <= b) { S.start = a; S.end = b; S.preset = 'custom'; await refresh(); }
}));
$('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = $('login-msg'); msg.className = ''; msg.textContent = T('sending');
  const { error } = await sb.auth.signInWithOtp({ email: $('email').value.trim(), options: { emailRedirectTo: location.origin + location.pathname } });
  if (error) { msg.className = 'err'; msg.textContent = error.message; } else { msg.textContent = T('link_sent'); }
});

// Local preview only: render with saved sample data. Never active on the live site; test_data.js is not published.
const LOCAL_PREVIEW = location.protocol === 'file:' || ['localhost', '127.0.0.1'].includes(location.hostname);
if (LOCAL_PREVIEW) {
  window.__pearlTest = async () => {
    await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'test_data.js'; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
    S.test = true; await startApp({ email: 'preview (sample data)' });
  };
}

(async function init() {
  renderChrome();
  if (!sb) { $('login').hidden = false; $('login-msg').className = 'err'; $('login-msg').textContent = 'Could not load the sign-in library.'; return; }
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' && session && !S.user) startApp(session.user);
    if (event === 'SIGNED_OUT') { S.user = null; showLogin(); }
  });
  const { data } = await sb.auth.getSession();
  if (data && data.session) { if (!S.user) startApp(data.session.user); } else if (!S.user) showLogin();
})();
</script>
